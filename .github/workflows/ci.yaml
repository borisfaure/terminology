name: ci

on:
  push:
  pull_request:

# A new push to a branch makes the run already in flight for it pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      COLUMNS: 150
      TERM: xterm-256color
    strategy:
      # One configuration failing says nothing about the others, and knowing
      # which ones also broke is the useful part of the report.
      fail-fast: false
      matrix:
        include:
          - name: gcc-debug
            runner: ubuntu-24.04
            cc: gcc
            options: -Dnls=false -Dbuildtype=debug -Dfuzzing=true -Dbenchmarks=true
            cflags: -O0 -g -Wall -Wextra

          - name: gcc-release
            runner: ubuntu-24.04
            cc: gcc
            options: -Dnls=true -Dbuildtype=release
            cflags: -O2 -g -Wall -Wextra
            # The release build is the one that has to survive being installed.
            install: true

          - name: clang-release
            runner: ubuntu-24.04
            cc: clang
            # lld rather than bfd, so the LLVM toolchain is exercised end to end.
            cc_ld: lld
            llvm: true
            options: -Dnls=false -Dbuildtype=release -Dfuzzing=true -Dbenchmarks=true
            cflags: -O2 -g -Wall -Wextra

          - name: clang-asan
            runner: ubuntu-24.04
            cc: clang
            llvm: true
            options: -Dnls=false -Dbuildtype=debug
            cflags: -O1 -g -fno-omit-frame-pointer -fsanitize=address -fno-sanitize-recover=address
            ldflags: -fsanitize=address

          - name: clang-ubsan
            runner: ubuntu-24.04
            cc: clang
            llvm: true
            options: -Dnls=false -Dbuildtype=debug
            cflags: -O1 -g -fno-omit-frame-pointer -fsanitize=undefined -fno-sanitize-recover=undefined
            ldflags: -fsanitize=undefined

          # TERMINOLOGY_HAVE_NEON is gated on __aarch64__, so these are the only
          # jobs that compile simd_neon.c to anything, run the parity test in
          # simd.c, or give TERMINOLOGY_SIMD_DISABLE something to switch off.
          # Both differ from their x86_64 twin above only in the runner.
          - name: gcc-debug-arm64
            runner: ubuntu-24.04-arm
            cc: gcc
            options: -Dnls=false -Dbuildtype=debug -Dfuzzing=true -Dbenchmarks=true
            cflags: -O0 -g -Wall -Wextra

          # asan so that a vector kernel storing outside its range is caught
          # rather than merely disagreeing with the scalar reference.
          - name: clang-asan-arm64
            runner: ubuntu-24.04-arm
            cc: clang
            llvm: true
            options: -Dnls=false -Dbuildtype=debug
            cflags: -O1 -g -fno-omit-frame-pointer -fsanitize=address -fno-sanitize-recover=address
            ldflags: -fsanitize=address

    steps:
      - uses: actions/checkout@v7

      # EFL 1.27 from noble/universe is new enough for the 1.26 the build asks
      # for, so there is nothing to build from source here. gperf generates
      # the X11 colour name table from color_names.gperf.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential meson ninja-build pkg-config gettext python3 gperf \
            libefl-all-dev libedje-bin libeet-bin libelementary-bin

      # libclang-rt carries the sanitizer runtimes; clang cannot even link a
      # -fsanitize= program without it.
      - name: Install LLVM toolchain
        if: matrix.llvm
        run: sudo apt-get install -y --no-install-recommends clang lld libclang-rt-18-dev

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CC_LD: ${{ matrix.cc_ld }}
          CFLAGS: ${{ matrix.cflags }}
          LDFLAGS: ${{ matrix.ldflags }}
        run: |
          meson setup -Dtests=true ${{ matrix.options }} \
            --prefix="${{ github.workspace }}/install" build
          meson configure build

      - name: Build
        run: ninja -C build

      - name: Test
        env:
          # EFL reaches for a D-Bus session bus that CI does not have, and
          # libdbus holds on to the error strings from the failed connection.
          # Suppress that one library rather than switching leak detection off.
          ASAN_OPTIONS: detect_leaks=1
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/tests/lsan.supp:print_suppressions=0
          UBSAN_OPTIONS: print_stacktrace=1
        run: meson test -C build --print-errorlogs

      - name: Install
        if: matrix.install
        run: ninja -C build install

      - name: Upload meson logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: meson-logs-${{ matrix.name }}
          path: build/meson-logs/

  targets:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.t.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: t
        run: echo "matrix=$(scripts/ci/targets.sh --json)" >> "$GITHUB_OUTPUT"

  # One job per EFL version, inside the images built by ci-images.yaml.
  # The image is pulled from GHCR; the job only checks out and builds, so
  # a PR's efl-compat jobs log the EFL commit and contain no apt or EFL
  # build step.
  efl-compat:
    name: ${{ matrix.target }}
    needs: targets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: ghcr.io/borisfaure/terminology-ci:${{ matrix.target }}-ubuntu24
    env:
      COLUMNS: 150
      TERM: xterm-256color
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      # The checkout is in $GITHUB_WORKSPACE, not the /src the script
      # defaults to for local podman runs.
      - run: scripts/ci/build-and-test.sh --src . --build build
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: meson-logs-${{ matrix.target }}
          path: build/meson-logs/

  # A PR that changes scripts/ci/ still runs against the published images;
  # its new Containerfile is checked by building and testing every target
  # from it, without pushing.
  ci-scripts-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.c.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: c
        run: |
          if git diff --name-only --diff-filter=ACMRTUXB "origin/${{ github.base_ref }}...HEAD" | grep -q '^scripts/ci/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  ci-scripts:
    name: ci-scripts-${{ matrix.target }}
    needs: [targets, ci-scripts-diff]
    if: needs.ci-scripts-diff.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      # From this PR's efl-deps.sh: the target build would otherwise start
      # FROM the published deps image.
      - run: scripts/ci/image.sh build-deps
      - run: scripts/ci/image.sh build ${{ matrix.target }}
      - run: scripts/ci/image.sh test ${{ matrix.target }} --logs "$PWD/build"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: meson-logs-${{ matrix.target }}
          path: build/meson-logs/

  coverage:
    name: coverage-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      COLUMNS: 150
      TERM: xterm-256color
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04

          # On x86_64 gcov sees simd_neon.c as a file with no code in it, so the
          # NEON kernels are absent from the report rather than shown uncovered.
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential meson ninja-build pkg-config gettext python3 gperf \
            libefl-all-dev libedje-bin libeet-bin libelementary-bin gcovr

      - name: Configure
        env:
          CC: gcc
          # Unoptimised, so that the line numbers gcov reports are the ones the
          # source actually has.
          CFLAGS: -O0 -g
        run: |
          meson setup -Dnls=false -Dtests=true -Db_coverage=true \
            -Dbuildtype=debug build
          meson configure build

      - name: Build
        run: ninja -C build

      - name: Test
        env:
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/tests/lsan.supp:print_suppressions=0
        run: meson test -C build --print-errorlogs

      # Only tytest is ever run, so it is the only target leaving .gcda behind
      # and there is nothing to double count. merge-mode-functions is needed
      # because a few static functions share a name across translation units.
      - name: Collect coverage
        run: |
          gcovr --root . --filter src/bin/ \
            --merge-mode-functions=merge-use-line-min \
            --xml-pretty -o coverage.xml --print-summary

      # Tokenless uploads are rate limited, so pass CODECOV_TOKEN if the repo
      # has it. A failed upload should not fail the build either way.
      #
      # The two architectures cover different sets of lines, so they upload
      # under separate flags and codecov merges them into one report instead of
      # the second arriving as a replacement for the first.
      #
      # Naming a file is not enough on its own to make it the only one sent:
      # the uploader still searches the tree and still runs its gcov plugin,
      # which found sixty more reports to add to ours, among them headers out
      # of /usr/include that the gcovr filter above exists to keep out. Upload
      # the report we built and nothing else.
      - name: Upload to codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          disable_search: true
          plugins: noop
          flags: ${{ matrix.arch }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload meson logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: meson-logs-coverage-${{ matrix.arch }}
          path: build/meson-logs/
